[workspace]
resolver = "3"
members = ["crates/synthswipe", "crates/synthswipe-bench", "crates/synthboard-core", "crates/synthboard-ffi", "crates/synthboard-seal"]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
overflow-checks = true
