[workspace]
resolver = "3"
members = ["crates/synthswipe", "crates/synthswipe-bench", "crates/synthswipe-onnx", "crates/synthboard-core", "crates/synthboard-ffi", "crates/synthboard-seal"]
exclude = ["training"]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"
repository = "https://github.com/synthe-se/synthboard"

[workspace.lints.rust]
# Deny, not forbid: two reviewed modules of synthboard-ffi may allow it. The other
# libraries forbid it in their own root, and the Mac tools stay under this deny.
unsafe_code = "deny"
missing_debug_implementations = "warn"
# `cargo fuzz` sets this one.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
overflow-checks = true
