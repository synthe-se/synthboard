[package]
name = "synthboard-seal"
description = "One-way sealing of records: the writer cannot read them back"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"], optional = true }
hkdf = { version = "0.13.0", optional = true }
hpke = { version = "0.15.1", default-features = false, features = ["alloc", "chacha", "getrandom", "hkdfsha2", "x25519"] }
sha2 = { version = "0.11.1", default-features = false }
x25519-dalek = { version = "3.0.0", features = ["static_secrets"], optional = true }
zeroize = "1.9.1"

[features]
# Opens records written before HPKE. Only the owner's tools need it.
legacy = ["dep:chacha20poly1305", "dep:hkdf", "dep:x25519-dalek"]

[lints]
workspace = true
