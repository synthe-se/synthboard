[package]
name = "synthswipe-bench"
description = "Replays recorded gestures through the public synthswipe API"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Links ONNX Runtime for `--neural`.
onnx = ["dep:synthswipe-onnx"]

[dependencies]
rayon = "1.12.0"
ruzstd = "0.9.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
synthboard-seal = { path = "../synthboard-seal", features = ["legacy"] }
synthswipe = { path = "../synthswipe" }
synthswipe-onnx = { path = "../synthswipe-onnx", optional = true }

[lints]
workspace = true
