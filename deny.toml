# What may enter the build. `tools/check-release.sh` runs this.

[graph]
targets = ["aarch64-linux-android"]

[advisories]
yanked = "deny"

[licenses]
# Licensing is decided later: this only records what is in use.
allow = ["Apache-2.0", "BSD-3-Clause", "MIT", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.9

# Our own crates have no licence yet, by choice.
[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
deny = [
    # Network: the keyboard must have no way to speak to anything.
    { crate = "curl" },
    { crate = "hyper" },
    { crate = "native-tls" },
    { crate = "openssl" },
    { crate = "reqwest" },
    { crate = "rustls" },
    { crate = "tokio" },
    { crate = "ureq" },
    # An allocator of its own would bypass hardened_malloc and memory tagging.
    { crate = "jemallocator" },
    { crate = "mimalloc" },
    { crate = "tikv-jemallocator" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
