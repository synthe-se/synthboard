[package]
name = "synthswipe-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
synthboard-ffi = { path = "../crates/synthboard-ffi" }
libfuzzer-sys = "0.4"
synthboard-core = { path = "../crates/synthboard-core" }
synthboard-seal = { path = "../crates/synthboard-seal", features = ["legacy"] }
synthswipe = { path = "../crates/synthswipe" }

[[bin]]
name = "fuzz_wire"
path = "fuzz_targets/fuzz_wire.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_seal"
path = "fuzz_targets/fuzz_seal.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_decoder"
path = "fuzz_targets/fuzz_decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_lexicon"
path = "fuzz_targets/fuzz_lexicon.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_engine"
path = "fuzz_targets/fuzz_engine.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_loaders"
path = "fuzz_targets/fuzz_loaders.rs"
test = false
doc = false
bench = false

[workspace]
